trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ansible/*
      - azure-pipelines.yml
      - server.js
      - package.json
      - routes/*
      - models/*
      - views/*
      - public/*
      - config/*
      - db/*

variables:
  - group: Epicbook-mysql-secrets

stages:
  - stage: Prepare
    displayName: Prepare
    pool:
      name: SelfHostedPool
    jobs:
      - job: PrepareJob
        steps:
          - checkout: self
          - script: |
              set -e
              python3 -m venv $(Agent.TempDirectory)/venv
              $(Agent.TempDirectory)/venv/bin/pip install ansible
              $(Agent.TempDirectory)/venv/bin/ansible-galaxy collection install community.mysql ansible.posix
            displayName: Install Ansible and collections
          - task: DownloadSecureFile@1
            name: sshKey
            inputs:
              secureFile: Mo.pem
          - script: chmod 600 $(sshKey.secureFilePath)
            displayName: Secure the key

  - stage: Validate
    displayName: Validate
    dependsOn: Prepare
    pool:
      name: SelfHostedPool
    jobs:
      - job: ValidateJob
        steps:
          - checkout: self
          - script: |
              set -e
              python3 -m venv $(Agent.TempDirectory)/venv
              $(Agent.TempDirectory)/venv/bin/pip install ansible
              $(Agent.TempDirectory)/venv/bin/ansible-galaxy collection install community.mysql ansible.posix
            displayName: Install Ansible and collections
          - task: DownloadSecureFile@1
            name: sshKey
            inputs:
              secureFile: Mo.pem
          - script: |
              set -e
              chmod 600 $(sshKey.secureFilePath)
              export ANSIBLE_HOST_KEY_CHECKING=False
              A=$(Agent.TempDirectory)/venv/bin
              $A/ansible-inventory -i ansible/inventory/hosts.ini --list > /dev/null
              $A/ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --syntax-check
              $A/ansible -i ansible/inventory/hosts.ini all -m ping --private-key $(sshKey.secureFilePath)
            displayName: Validate inventory, syntax and SSH connectivity

  - stage: Deploy
    displayName: Configure and Deploy
    dependsOn: Validate
    pool:
      name: SelfHostedPool
    jobs:
      - job: DeployJob
        steps:
          - checkout: self
          - script: |
              set -e
              python3 -m venv $(Agent.TempDirectory)/venv
              $(Agent.TempDirectory)/venv/bin/pip install ansible
              $(Agent.TempDirectory)/venv/bin/ansible-galaxy collection install community.mysql ansible.posix
            displayName: Install Ansible and collections
          - task: DownloadSecureFile@1
            name: sshKey
            inputs:
              secureFile: Mo.pem
          - script: |
              set -e
              chmod 600 $(sshKey.secureFilePath)
              export ANSIBLE_HOST_KEY_CHECKING=False
              $(Agent.TempDirectory)/venv/bin/ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --private-key $(sshKey.secureFilePath) -e "db_admin_username=$DB_USER" -e "db_admin_password=$DB_PASS"
            displayName: Run Ansible playbook
            env:
              DB_USER: $(mysqlAdminUsername)
              DB_PASS: $(mysqlAdminPassword)

  - stage: Verify
    displayName: Verify
    dependsOn: Deploy
    pool:
      name: SelfHostedPool
    jobs:
      - job: VerifyJob
        steps:
          - script: |
              set -e
              code=$(curl -s -o /dev/null -w "%{http_code}" http://16.16.186.69/)
              echo "Frontend returned HTTP $code"
              test "$code" = "200"
            displayName: Check frontend responds